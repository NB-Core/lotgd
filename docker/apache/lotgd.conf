<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined

    ErrorDocument 403 /errors/403.html
    ErrorDocument 404 /errors/404.html
    ErrorDocument 500 /errors/5xx.html
    ErrorDocument 501 /errors/5xx.html
    ErrorDocument 502 /errors/5xx.html
    ErrorDocument 503 /errors/5xx.html
    ErrorDocument 504 /errors/5xx.html
    ErrorDocument 505 /errors/5xx.html
    ErrorDocument 506 /errors/5xx.html
    ErrorDocument 507 /errors/5xx.html
    ErrorDocument 508 /errors/5xx.html

    <Directory /var/www/html>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # Dotfiles (.env, .git metadata, editor state) and backup copies are never
    # web content. Apache's Debian base configuration already denies .ht* files.
    <FilesMatch "^\.|.*\.bak$">
        Require all denied
    </FilesMatch>

    # Repository, build, and template sources that are read by PHP but must not
    # be downloadable verbatim.
    <FilesMatch "\.(dist|htm|ini|lock|log|neon|sh|sql|twig|ya?ml)$">
        Require all denied
    </FilesMatch>

    # Project metadata that ships with the checkout but is not web content.
    <FilesMatch "^(composer\.json|Dockerfile|phpunit\.xml|phpcs\.xml)$|\.md$">
        Require all denied
    </FilesMatch>

    # cron.php is a CLI maintenance entry point. Reaching it over HTTP can
    # trigger a full newday/database-cleanup run, so it is denied here rather
    # than relying on the .htaccess rule documented for non-Docker hosts;
    # this vhost sets AllowOverride None and never reads .htaccess files.
    <Files "cron.php">
        Require all denied
    </Files>

    # Versioned asset URLs may be reused by browsers and reverse proxies. Keep
    # the lifetime bounded so extensions and custom themes that use unversioned
    # URLs are not left stale indefinitely.
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType text/css "access plus 7 days"
        ExpiresByType application/javascript "access plus 7 days"
        ExpiresByType text/javascript "access plus 7 days"
        ExpiresByType image/avif "access plus 30 days"
        ExpiresByType image/gif "access plus 30 days"
        ExpiresByType image/jpeg "access plus 30 days"
        ExpiresByType image/png "access plus 30 days"
        ExpiresByType image/svg+xml "access plus 30 days"
        ExpiresByType image/webp "access plus 30 days"
        ExpiresByType font/woff2 "access plus 30 days"
    </IfModule>

    <IfModule mod_headers.c>
        <FilesMatch "\.(avif|css|gif|jpe?g|js|png|svg|webp|woff2)$">
            Header merge Cache-Control "public"
        </FilesMatch>

        # PHP pages receive their security headers from the application's
        # runtime hardening bootstrap. Static files and error documents never
        # reach it, so set the content-type guard for them here. Setting it
        # only for static extensions avoids emitting a second, conflicting
        # header on responses the application already annotated.
        <FilesMatch "\.(avif|css|gif|html?|ico|jpe?g|js|png|svg|txt|webp|woff2)$">
            Header set X-Content-Type-Options "nosniff"
        </FilesMatch>

        # Never allow shared caches to retain personalized game responses.
        <FilesMatch "\.php$">
            Header always set Cache-Control "no-store, private"
        </FilesMatch>
    </IfModule>

    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE application/javascript application/json image/svg+xml text/css text/html text/javascript text/plain
    </IfModule>

    # Preserve the access boundary formerly supplied by nested .htaccess files.
    # PHP wrappers and modules are loaded by entry points, never invoked directly.
    <Directory /var/www/html/lib>
        <FilesMatch "\.php$">
            Require all denied
        </FilesMatch>
    </Directory>

    <Directory /var/www/html/modules>
        <FilesMatch "\.php$">
            Require all denied
        </FilesMatch>
    </Directory>

    # Page fragments are included by the root entry points and depend on their
    # bootstrap. A direct request would run them without it, which at best
    # fails and at worst reveals internals; module and template assets stay
    # reachable because only PHP is denied.
    <Directory /var/www/html/pages>
        <FilesMatch "\.php$">
            Require all denied
        </FilesMatch>
    </Directory>

    <Directory /var/www/html/async/common>
        <FilesMatch "\.php$">
            Require all denied
        </FilesMatch>
    </Directory>

    # Directories that contain no web-reachable content at all. Composer
    # dependencies, application classes, migrations, maintenance scripts, and
    # the image's own build files ship inside the document root because the
    # legacy layout has no separate public/ directory; deny them wholesale
    # instead of relying on the absence of a directly callable entry point.
    <DirectoryMatch "^/var/www/html/(bin|config|docker|docs|logs|migrations|scripts|src|tests|vendor)(/|$)">
        Require all denied
    </DirectoryMatch>

    # Installer diagnostics may contain credentials and internal paths. They
    # are never web content, even while installation is explicitly enabled.
    <Directory /var/www/html/install/errors>
        Require all denied
    </Directory>

    # Readiness is intentionally outside the application document root and is
    # callable only from inside this container. Reverse proxies and host-port
    # clients must not be able to use it as a database diagnostic endpoint.
    Alias /_health/ready /var/www/lotgd-health/ready.php
    <Directory /var/www/lotgd-health>
        AllowOverride None
        Options -Indexes
        Require local
    </Directory>

    # Installation is an explicit, temporary administrative action. The
    # completion marker still wins because entrypoint removes installer.php.
    RewriteEngine On
    RewriteCond %{ENV:LOTGD_STATE_PATH}/installation-complete -f
    RewriteRule ^/(?:installer\.php|install(?:/|$)) - [F,L]

    RewriteCond %{ENV:LOTGD_INSTALL_ENABLED} !=1
    RewriteRule ^/(?:installer\.php|install(?:/|$)) - [F,L]

    # Keep installer support files unreachable after installer.php is removed,
    # even if an old environment still has the installation flag enabled.
    RewriteCond %{REQUEST_URI} ^/install/ [NC]
    RewriteCond %{DOCUMENT_ROOT}/installer.php !-f
    RewriteRule ^/install/ - [F,L]
</VirtualHost>
