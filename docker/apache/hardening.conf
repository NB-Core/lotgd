# Server-wide hardening. These directives are only valid in server config
# context, so they cannot live in the game's virtual host. The file is copied
# into conf-enabled/ with a "zz-" prefix so it is read after the base image's
# own security.conf and wins on conflicts.

# The Debian/Ubuntu base sets "ServerTokens OS", which advertises the exact
# Apache build and distribution in every response and in error documents.
ServerTokens Prod
ServerSignature Off

# TRACE has no use for this application and is a recurring finding in scanner
# reports; deny it globally rather than per virtual host.
TraceEnable Off
