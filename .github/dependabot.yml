version: 2
updates:
  # Docker digest updates retain the human-readable tags in Dockerfile and
  # docker-compose.yml while proposing reviewable, immutable replacements.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies
      - security
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - security
    groups:
      composer-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  # Workflow actions are pinned by major tag, so the base images and the CI
  # that verifies them are updated through the same review path.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies
      - security
    # One PR for all of them. Action majors move in lockstep -- the whole
    # ecosystem migrated to Node 24 at once -- and reviewing five identical
    # runtime bumps separately costs five CI runs to learn one thing. Grouping
    # is deliberately not applied to the docker ecosystem below: a base image
    # bump changes what the application runs on and is worth its own review.
    groups:
      github-actions:
        patterns:
          - "*"
