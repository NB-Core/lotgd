name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.3 is the floor documented in README/composer platform config; 8.4
        # is what the Docker runtime image actually serves.
        php-version: ['8.3', '8.4']
    env:
      PHP_VERSION: ${{ matrix.php-version }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer
      - name: Cache Composer files
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-php-${{ env.PHP_VERSION }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ env.PHP_VERSION }}-composer-
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
      - name: Run static analysis
        run: composer static
#      - name: Run PHPCS
#        run: composer lint
      - name: Lint PHP files
        run: |
          find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run tests
        run: composer test

  sql-guard:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        # Full history so the merge base with the target branch is available.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: none
      # Only the lines this change adds are examined, so the historical
      # findings in untouched code do not block anything and the job costs
      # a git diff plus a tokenizer pass over the changed files.
      - name: Reject new SQL value interpolation
        run: |
          base="origin/${{ github.base_ref || github.event.repository.default_branch }}"
          git fetch --quiet origin "${{ github.base_ref || github.event.repository.default_branch }}"
          php scripts/check-sql-value-interpolation.php --changed-since="$base"

  docker:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Reject application-image build toolchains
        run: tests/Docker/no-build-toolchain.sh
      - name: Verify pinned base images support AMD64 and ARM64
        run: |
          for image in \
            'composer:2@sha256:d8f6343d3fae98107426bc49163ccad46ef85aabd4a27d80a74401fab4aba332' \
            'thecodingmachine/php:8.4-v5-apache@sha256:d04b2b76c615c9af90cdc66b54cf4e4d09eba64ee74f9bbbd79b78b06d902a66' \
            'mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb'
          do
            docker buildx imagetools inspect "$image" \
              --format '{{json .Manifest}}' > /tmp/image-manifest.json
            # OS and architecture are separate JSON properties; query them as
            # a pair instead of looking for a synthetic platform string.
            jq -e 'any(.manifests[]; .platform.os == "linux" and .platform.architecture == "amd64")' /tmp/image-manifest.json
            jq -e 'any(.manifests[]; .platform.os == "linux" and .platform.architecture == "arm64")' /tmp/image-manifest.json
          done
      - name: Build and load AMD64 application image once
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: lotgd-ci:${{ github.sha }}
          push: false
          cache-from: type=gha,scope=lotgd-amd64
          cache-to: type=gha,mode=max,scope=lotgd-amd64
      - name: Validate hardened Compose model
        run: tests/Docker/compose-security.sh
      - name: Run production smoke test
        run: tests/Docker/smoke.sh lotgd-ci:${{ github.sha }}
