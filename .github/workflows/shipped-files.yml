name: Shipped files list

# Keeps src/Lotgd/Upgrade/shipped-files.txt in step with the files on master.
# The installer, the automatic schema upgrade and the Diagnostics page read it
# to tell an incomplete FTP upload from a complete one. It changes only when
# files are added, removed or renamed; regenerating it here means nobody has
# to remember that after `composer update` or a new class.
#
# The commit is made with GITHUB_TOKEN, and pushes made with it do not start
# other workflows, so this cannot loop and does not rebuild the image.
on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shipped-files
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: master
      - name: Regenerate the list
        run: php scripts/build-shipped-files.php
      - name: Commit it if it changed
        run: |
          if git diff --quiet -- src/Lotgd/Upgrade/shipped-files.txt; then
            echo "The list is current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Lotgd/Upgrade/shipped-files.txt
          git commit -m "chore: update the shipped files list" \
            -m "Generated by .github/workflows/shipped-files.yml from the files on master."
          # Another push may have landed meanwhile. Replay on top of it and
          # regenerate, so the list describes what master actually holds.
          for attempt in 1 2 3; do
            if git push origin HEAD:master; then
              exit 0
            fi
            git fetch origin master
            git reset --hard origin/master
            php scripts/build-shipped-files.php
            if git diff --quiet -- src/Lotgd/Upgrade/shipped-files.txt; then
              echo "The list is current after the newer push."
              exit 0
            fi
            git add src/Lotgd/Upgrade/shipped-files.txt
            git commit -m "chore: update the shipped files list" \
              -m "Generated by .github/workflows/shipped-files.yml from the files on master."
          done
          echo "Could not push the updated list after three attempts." >&2
          exit 1
