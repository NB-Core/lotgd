name: Release

on:
  # Manual only: release archives are prepared by maintainers on demand.
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to package (for example: v2.0.0)"
        required: true
        type: string

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      # Package the tag that was asked for, not the branch the workflow was
      # started from.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.release_tag }}
          fetch-depth: 0
      - name: Extract version
        id: vars
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          # Remove leading 'v' from the tag name
          VERSION="${RELEASE_TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
      # An archive whose common.php names another version would install as
      # that version, so refuse to build one. The check is written out here
      # rather than in a script, because an older tag being packaged does
      # not contain one.
      - name: Check version
        env:
          VERSION: ${{ steps.vars.outputs.VERSION }}
        run: |
          DECLARED=$(sed -n 's/^\$logd_version = "\([^" ]*\).*";$/\1/p' common.php)
          if [ "$DECLARED" != "$VERSION" ]; then
            echo "::error::common.php declares version '$DECLARED', but the tag is for '$VERSION'."
            exit 1
          fi
          echo "common.php declares $DECLARED, matching the tag."
      - name: Create archives
        run: |
          VERSION=${{ steps.vars.outputs.VERSION }}
          mkdir dist
          tar --exclude='.git*' --exclude='.github' --exclude='tests' --exclude='./tools' \
              --exclude='phpunit.xml' --exclude='.phpunit.result.cache' \
              --exclude='dist' -czf "dist/lotgd-${VERSION}.tar.gz" .
          zip -r "dist/lotgd-${VERSION}.zip" . \
              -x '*.git*' -x '.github/*' -x 'tests/*' -x 'tools/*' -x 'phpunit.xml' -x '.phpunit.result.cache' -x 'dist/*'
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lotgd-${{ steps.vars.outputs.VERSION }}
          # Keep release workflow artifacts briefly to reduce billable storage.
          retention-days: 14
          path: |
            dist/lotgd-${{ steps.vars.outputs.VERSION }}.tar.gz
            dist/lotgd-${{ steps.vars.outputs.VERSION }}.zip
