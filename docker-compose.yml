services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LOTGD_HTTP_PORT:-8080}:80"
    env_file: .env
    environment:
      APP_ENV: production
      MYSQL_USEDATACACHE: "1"
      MYSQL_DATACACHEPATH: /var/cache/lotgd
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      LOTGD_INSTALL_ENABLED: ${LOTGD_INSTALL_ENABLED:-0}
    volumes:
      - lotgd_cache:/var/cache/lotgd
      - lotgd_state:/var/lib/lotgd
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(file_get_contents('http://127.0.0.1/errors/403.html') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - lotgd-network

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lotgd}
      MYSQL_USER: ${MYSQL_USER:-lotgduser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping --host=127.0.0.1 --user=root --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - lotgd-network

volumes:
  db_data:
  lotgd_cache:
  lotgd_state:

networks:
  lotgd-network:
