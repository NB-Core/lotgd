services:
  web:
    image: ${LOTGD_WEB_IMAGE:-lotgd-web:local}
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LOTGD_HTTP_PORT:-8080}:80"
    env_file: .env
    environment:
      APP_ENV: production
      MYSQL_USEDATACACHE: "1"
      MYSQL_DATACACHEPATH: /var/cache/lotgd
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lotgd}
      MYSQL_HOST: ${MYSQL_HOST:-db}
      MYSQL_USER: ${MYSQL_USER:-lotgduser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      LOTGD_INSTALL_ENABLED: ${LOTGD_INSTALL_ENABLED:-0}
      LOTGD_DATA_DIR: /var/lib/lotgd/logs
      LOTGD_STATE_PATH: /var/lib/lotgd
    volumes:
      - lotgd_cache:/var/cache/lotgd
      - lotgd_state:/var/lib/lotgd
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Compose uses $$ to pass a literal $ through to the PHP process.
      test: ["CMD", "php", "-r", "$$c=get_headers('http://127.0.0.1/_health/ready'); exit($$c !== false && str_contains($$c[0], '204') ? 0 : 1);"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 60s
    networks:
      - lotgd-network

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lotgd}
      MYSQL_USER: ${MYSQL_USER:-lotgduser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping --host=127.0.0.1 --user=root --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - lotgd-network

volumes:
  db_data:
  lotgd_cache:
  lotgd_state:

networks:
  lotgd-network:
