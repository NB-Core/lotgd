services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "${LOTGD_HTTP_PORT:-80}:80"
    env_file: .env
    environment:
      APP_ENV: production
      MYSQL_USEDATACACHE: "1"
      MYSQL_DATACACHEPATH: /var/cache/lotgd
    volumes:
      - lotgd_cache:/var/cache/lotgd
      - lotgd_state:/var/lib/lotgd
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "lotgd-healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 60s
    networks:
      - lotgd-network

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lotgd}
      MYSQL_USER: ${MYSQL_USER:-lotgduser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-lotgdpass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping --host=127.0.0.1 --user=root --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - lotgd-network

volumes:
  db_data:
  lotgd_cache:
  lotgd_state:

networks:
  lotgd-network:
