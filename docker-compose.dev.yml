services:
  web:
    environment:
      APP_ENV: development
    volumes:
      - .:/var/www/html
      # Keep dependencies and generated cache inside Docker, not on the host.
      - lotgd_vendor:/var/www/html/vendor
      - lotgd_cache:/var/cache/lotgd
      # The entrypoint links this into the runtime's version-specific PHP scan
      # directory, so this path does not have to track the PHP version.
      - ./docker/php/development.ini:/etc/lotgd/php-development.ini:ro

volumes:
  lotgd_vendor:
